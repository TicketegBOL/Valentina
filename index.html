<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hunter Designer Experience</title>
    
    <!-- GSAP Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Playfair+Display:ital,wght@0,600;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <!-- Iconos Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        /* =========================================
           VARIABLES & CONFIGURACIÓN
           ========================================= */
        :root {
            --bg-image: url('https://images.unsplash.com/photo-1604014237800-1c9102c219da?q=80&w=1000&auto=format&fit=crop'); 
            --bg-invitacion: url('https://images.unsplash.com/photo-1511795409834-ef04bbd61622?q=80&w=1000&auto=format&fit=crop');
            --gold-light: #FFF5C3;
            --gold-mid: #D4AF37;
            --gold-dark: #886C21;
            --text-black: #0a0a0a;
            --glass-bg: rgba(0, 0, 0, 0.85);
        }

        /* =========================================
           RESET & BASE
           ========================================= */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            outline: none;
        }

        .no-select {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Evita scroll indeseado */
            background-color: #000;
            color: white;
            font-family: 'Montserrat', sans-serif;
            position: fixed; /* Ayuda a fijar la vista en móviles */
        }

        /* =========================================
           PARTÍCULAS & EFECTOS MEJORADOS
           ========================================= */
        #particles-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            /* Efecto de brillo más fuerte */
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 5px var(--gold-mid);
            opacity: 0.8;
        }

        @keyframes goldenPulse {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        /* =========================================
           FONDO BACKDROP (PC)
           ========================================= */
        .backdrop-blur {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            filter: blur(30px) brightness(0.4);
            transform: scale(1.1);
            z-index: 0;
            display: none; /* Oculto en móvil para rendimiento */
        }
        
        @media (min-width: 600px) {
            .backdrop-blur { display: block; }
        }

        /* =========================================
           CONTENEDOR PRINCIPAL
           ========================================= */
        .mobile-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        @media (min-width: 600px) {
            body {
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .mobile-wrapper { 
                position: relative;
                width: auto;
                aspect-ratio: 9 / 16;
                height: 92vh;
                border-radius: 20px; 
                border: 1px solid #333;
            }
        }

        /* =========================================
           PANTALLAS (VIEWS)
           ========================================= */
        .view-section {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none; /* Por defecto oculto */
            flex-direction: column;
            background: var(--glass-bg);
            z-index: 20;
            /* Relleno para evitar la zona del "notch" o barra de estado */
            padding-top: env(safe-area-inset-top); 
            padding-bottom: env(safe-area-inset-bottom);
        }

        #home-view {
            display: block; /* Solo home visible al inicio */
            z-index: 50;
            background: transparent; 
        }

        /* =========================================
           BOTONES PRINCIPALES
           ========================================= */
        .btn-gold {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-black);
            text-decoration: none;
            text-transform: uppercase;
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fceabb 0%, #ffd19c 50%, #ffdea1 100%);
            border: 2px solid #fff;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.5);
            cursor: pointer;
            z-index: 20;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            animation: goldenPulse 2s infinite;
        }

        .btn-gold::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.8), transparent);
            transform: skewX(-20deg);
            transition: 0.5s;
        }
        .btn-gold:hover::after { left: 150%; transition: 0.7s; }

        /* POSICIONES HOME */
        #btn-invitacion { top: 50%; left: 75%; width: 42%; height: 6.5%; }
        #btn-galeria-home { top: 59%; left: 75%; width: 42%; height: 6.5%; }
        #btn-recuerdo-home { top: 80%; left: 50%; width: 55%; height: 7.5%; font-size: 16px; }

        /* =========================================
           ESTILOS INTERNOS
           ========================================= */
        
        .btn-back {
            position: absolute;
            top: max(25px, env(safe-area-inset-top) + 10px); /* Ajuste seguro */
            left: 20px;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--gold-mid);
            color: var(--gold-mid);
            width: 45px; height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            cursor: pointer;
            z-index: 200;
            transition: 0.2s;
            -webkit-user-select: none;
        }
        .btn-back:hover { background: var(--gold-mid); color: #000; transform: scale(1.1); }

        /* VISTA INVITACIÓN */
        #view-invitacion {
            background-image: var(--bg-invitacion);
            background-size: cover;
            background-position: center;
            box-shadow: inset 0 0 0 2000px rgba(0,0,0,0.75); 
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .invite-container {
            text-align: center;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .invite-script-text {
            font-family: 'Great Vibes', cursive;
            font-size: 2.4rem;
            line-height: 1.2;
            color: var(--gold-light);
            text-shadow: 0 2px 10px rgba(0,0,0,1);
            margin-bottom: 20px;
            width: 95%;
        }

        .sub-nav-btn {
            background: rgba(20, 20, 20, 0.7);
            border: 1px solid var(--gold-mid);
            color: white;
            padding: 16px 0;
            width: 100%;
            max-width: 300px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            -webkit-user-select: none;
            user-select: none;
            transition: all 0.2s;
        }
        .sub-nav-btn:active { transform: scale(0.95); background: var(--gold-mid); color: black; }
        
        .btn-confirmar {
            background: rgba(212, 175, 55, 0.2);
            border: 2px solid var(--gold-mid);
            font-weight: 900;
            animation: goldenPulse 3s infinite;
        }

        /* VISTA UBICACIÓN */
        #view-ubicacion {
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .map-frame {
            width: 95%;
            height: 350px;
            border: 2px solid var(--gold-mid);
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 10px;
        }

        /* VISTA GALERÍA */
        #view-galeria {
            overflow: hidden;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .gallery-window {
            width: 100%;
            height: 450px; 
            overflow: hidden; 
            position: relative;
            display: flex;
            align-items: center;
            margin-top: 40px;
        }

        .gallery-track {
            display: flex;
            gap: 20px;
            padding-left: 20px;
        }

        .gallery-card {
            width: 280px; 
            height: 400px;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--gold-mid);
            flex-shrink: 0;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .gallery-card img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.5s;
        }
        
        /* VISTA RECUERDO (VIDEO 9:16) */
        #view-recuerdo {
            padding: 0; 
            background: #000;
            justify-content: center;
            align-items: center;
        }
        
        .video-container {
            aspect-ratio: 9 / 16;
            height: 90%; 
            width: auto; 
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            border: 2px solid var(--gold-mid); 
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.2);
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        /* =========================================
           FOOTER WHATSAPP
           ========================================= */
        .footer-hunter {
            position: absolute;
            bottom: max(4%, env(safe-area-inset-bottom) + 10px);
            left: 50%; transform: translate(-50%, 0);
            width: 100%; 
            text-align: center; 
            z-index: 60; 
            text-decoration: none; 
            cursor: pointer; 
            pointer-events: auto; 
        }
        
        .footer-hunter span {
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.8);
            background: linear-gradient(to right, rgba(255,255,255,0.4) 0%, #FFF5C3 50%, rgba(255,255,255,0.4) 100%);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

    </style>
</head>
<body class="no-select">

    <div class="backdrop-blur"></div>

    <div class="mobile-wrapper">

    <!-- SCRIPT DE LÓGICA -->
    <script>
        // --- 1. Variables de Estado ---
        let currentViewId = 'home';
        let historyStack = []; 
        let galleryAnimation = null;

        // --- 2. Navegación SIN EFECTOS (Instantánea) ---
        function navigateTo(target, pushToHistory = true) {
            const nextViewId = target === 'home' ? 'home-view' : `view-${target}`;
            const currentView = document.getElementById(currentViewId === 'home' ? 'home-view' : `view-${currentViewId}`);
            const nextView = document.getElementById(nextViewId);

            if (!nextView) return; // Seguridad si el ID no existe

            // Historial: Solo agregamos si es una navegación nueva, no si estamos volviendo
            if (pushToHistory && currentViewId !== 'home') {
                historyStack.push(currentViewId);
            } else if (target === 'home') {
                // Si vamos al home, limpiamos historial para evitar bucles raros
                historyStack = [];
            }

            // CAMBIO INSTANTÁNEO
            if (currentView) currentView.style.display = 'none';
            
            // Pausar video al salir
            const video = document.querySelector('video');
            if (video && target !== 'recuerdo') video.pause(); 
            
            // Galería lógica
            if(target === 'galeria') startGalleryAuto();
            else stopGalleryAuto();

            // Aparecer siguiente
            nextView.style.display = (target === 'home') ? 'block' : 'flex';
            
            // Actualizar ID actual
            currentViewId = target;
        }

        // --- 3. Función Volver CORREGIDA ---
        function goBack() {
            // Si hay historial, sacamos el último. Si no, forzamos ir a Home.
            if (historyStack.length > 0) {
                const previousView = historyStack.pop();
                navigateTo(previousView, false); // false = no añadir al historial de nuevo
            } else {
                // Fallback seguro: siempre vuelve a Home si el stack está vacío
                navigateTo('home', false);
            }
        }

        // --- 4. Partículas "Mágicas" (AUMENTADAS Y GRANDES) ---
        function createParticles() {
            const container = document.getElementById('particles-container');
            const particleCount = 60; // Cantidad

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Tamaños MÁS GRANDES como pidió el usuario
                const size = Math.random() * 8 + 3; // De 3px a 11px
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                
                // Color variado: Oro y Blanco
                const isGold = Math.random() > 0.5; 
                particle.style.background = isGold ? 'rgba(255, 215, 0, 0.8)' : 'rgba(255, 255, 255, 0.8)';
                
                // Retraso de animación CSS
                particle.style.animationDelay = `${Math.random() * 5}s`;

                container.appendChild(particle);

                // Movimiento suave con GSAP
                const speed = Math.random() * 15 + 10; // Movimiento más lento y majestuoso
                const dirY = -150 - (Math.random() * 200); 

                gsap.to(particle, {
                    y: dirY, 
                    x: `random(-80, 80)`, 
                    opacity: 0,
                    duration: speed,
                    repeat: -1,
                    ease: "sine.inOut",
                    delay: Math.random() * 5
                });
            }
        }
        createParticles();

        // --- 5. Animación Inicial Home ---
        gsap.from(".btn-gold", {
            duration: 1.5,
            y: 30,
            opacity: 0,
            stagger: 0.2,
            ease: "power2.out",
            delay: 0.5
        });

        // --- 6. Galería Automática (MÁS RÁPIDA) ---
        function startGalleryAuto() {
            if(galleryAnimation) galleryAnimation.kill();
            
            // Reset
            gsap.set(".gallery-track", {x: 0});
            gsap.set("#gallery-progress", {width: "0%"});
            
            galleryAnimation = gsap.timeline({ repeat: -1 });
            
            // Tiempos ajustados: 0.8s duración, 1.5s espera (delay)
            const speed = 0.8; 
            const pause = 1.2;

            galleryAnimation.to(".gallery-track", {
                x: "-300px", duration: speed, ease: "power2.out", delay: pause
            })
            .to("#gallery-progress", { width: "33%", duration: speed, ease: "power2.out" }, "<")
            
            .to(".gallery-track", {
                x: "-600px", duration: speed, ease: "power2.out", delay: pause
            })
            .to("#gallery-progress", { width: "66%", duration: speed, ease: "power2.out" }, "<")

            .to(".gallery-track", {
                x: "-900px", duration: speed, ease: "power2.out", delay: pause
            })
            .to("#gallery-progress", { width: "100%", duration: speed, ease: "power2.out" }, "<")

            .to(".gallery-track", {
                x: "0px", duration: 0.5, ease: "power4.inOut", delay: 0.5
            })
             .to("#gallery-progress", { width: "0%", duration: 0.5 }, "<");
        }

        function stopGalleryAuto() {
            if(galleryAnimation) {
                galleryAnimation.pause();
            }
        }

        // --- 7. Ajustes Altura Móvil (Fix barra navegador) ---
        const setAppHeight = () => {
            const doc = document.documentElement;
            doc.style.setProperty('--app-height', `${window.innerHeight}px`);
        }
        window.addEventListener('resize', setAppHeight);
        setAppHeight();

    </script>
</body>
